name: Strella
description: 'Strella is an AI-powered customer research platform that automates qualitative
  research at scale. It runs AI-moderated interviews with adaptive questioning, auto-generates
  discussion guides, recruits participants from an 8M+ global panel or a company''s own
  customers, supports 46+ languages, and synthesizes insights and video highlights within
  hours instead of weeks. Research types span exploratory research, concept testing, usability
  testing, market research, and customer journey mapping. Strella is backed by Bessemer
  Venture Partners. No public developer API or SDK surface is currently published; this
  profile captures the company identity, security posture, and product changelog.'
